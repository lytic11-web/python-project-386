name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        continue-on-error: true
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}
