name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Backend runs as a service, not in Docker
      # We'll start it directly in the steps

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -U pip
          pip install -r <(echo "fastapi>=0.100.0
            uvicorn[standard]>=0.30.0
            sqlalchemy>=2.0.0
            pydantic>=2.0.0
            python-multipart>=0.0.5
            email-validator>=2.0.0")

      - name: Start backend
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -s http://localhost:8000/owner || echo "Backend failed to start"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install chromium

      - name: Start frontend
        run: |
          cd frontend
          npm run dev &
          sleep 3

      - name: Run e2e tests
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
